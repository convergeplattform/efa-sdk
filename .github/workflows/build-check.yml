name: Build Check

# PR-/Push-Gate: spiegelt die Release-Schritte (publish.yml) auf JEDEM Push/PR, damit ein
# stiller Build-/Lint-/Test-Break nicht erst beim v*-Tag auffällt — dort ist er teuer,
# weil der Tag den npm-Publish auslöst.
#
# Das SDK ist ein Single-Package-Repo: EIN Root-package.json, Quellen unter src/,
# Tests unter test/. Die Ordner backend/ + frontend/ im Root sind der GENERIERTE
# tsc-Output (gitignored, npm-`files`) — sie sind KEINE Workspaces und dürfen nicht
# wie in den App-Repos als Matrix-Dimension verwendet werden.
#
# Test-/Coverage-Standard: TESTING.md im Meta-Repo („Coverage-Ratchet"),
# Referenz-Implementierung: apps/converge-kernel.

on:
  workflow_call:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Der self-hosted Runner (dw-vps-converge) ist ein einziger, geteilter Runner mit
# belegten Queue-Zeiten von 15-21 Minuten. Überholte Läufe desselben Branches abbrechen.
# ACHTUNG: nicht auf `workflow_call`-Läufe aus publish.yml durchschlagen lassen — die
# laufen auf einem Tag-Ref und haben damit eine eigene concurrency-group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk:
    name: sdk (tsc + test + lint + build)
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Vitest + Coverage-Gate)
        run: npm run test:coverage

      - name: Lint (ESLint)
        run: npm run lint

      # Baut backend/ + frontend/ exakt wie prepublishOnly beim Release. Der
      # postbuild-Schritt enthält das ESM-Specifier-Gate — ein Regressionsschutz gegen
      # unvollständige Import-Specifier, die erst beim Konsumenten knallen würden.
      - name: Build (wie prepublishOnly)
        run: npm run build

  template:
    # Das Scaffold unter template/ wird von /new-app in jedes neue App-Repo kopiert und
    # von Bestands-Apps als Referenz gezogen. Ein stales Lockfile bricht dort JEDEN
    # Docker-Build (`npm ci`) — genau das war der Fall (Lock pinnte @efa-one/sdk 1.10.1
    # gegen ein Manifest mit ^1.11.0 → `npm ci` EUSAGE). Dieser Job hält das Lock ehrlich.
    name: template scaffold (npm ci)
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        dir: [template/backend, template/frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: npm ci (Lockfile ↔ Manifest konsistent?)
        working-directory: ${{ matrix.dir }}
        run: npm ci
      # Ein Scaffold, das nicht kompiliert, würde still ausgeliefert und erst im ersten
      # /new-app-Docker-Build knallen. backend: `tsc`, frontend: `tsc && vite build`.
      - name: npm run build (kompiliert das Scaffold?)
        working-directory: ${{ matrix.dir }}
        run: npm run build
