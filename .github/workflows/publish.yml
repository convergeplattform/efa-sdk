name: Publish @efa-one/sdk

# Löst den npm-Publish beim Pushen eines v*-Tags aus (analog zum GHCR-Flow der Apps).
# Der reine main-Push publiziert nichts.
on:
  push:
    tags:
      - 'v*'

jobs:
  # Vollständiger Qualitäts-Gate vor dem Publish: derselbe Workflow, der auch auf
  # Push/PR läuft (tsc + Coverage-Gate + ESLint + Build + Scaffold-`npm ci`). So kann
  # kein Release an einem Stand entstehen, den der PR-Gate abgelehnt hätte — und
  # „Build UND Tests grün" fällt in EINEN Workflow-Lauf mit dem Publish.
  checks:
    uses: ./.github/workflows/build-check.yml

  publish:
    needs: checks
    # Org-Minuten/Billing-Bug: bei gesetzter Repo-Var RUNNER_LABEL=self-hosted läuft
    # der Job auf dem self-hosted Runner (dw-vps-converge), sonst GitHub-hosted.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write   # OIDC für npm Trusted Publishing (kein langlebiger Token)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      # Trusted Publishing (OIDC) braucht npm >= 11.5.1 — Node 24 bringt npm 11.x,
      # zur Sicherheit auf latest heben.
      - name: npm auf OIDC-fähige Version heben
        run: npm install -g npm@latest

      - name: Tag ↔ package.json-Version abgleichen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG passt nicht zu package.json ($PKG). Erst 'npm version' dann taggen."
            exit 1
          fi
          echo "Version $PKG bestätigt."

      # Trusted Publishing: npm authentifiziert sich per OIDC (id-token oben) gegen
      # den auf npmjs.com hinterlegten Trusted Publisher — KEIN NODE_AUTH_TOKEN nötig.
      # npm publish baut via prepublishOnly neu (backend/ + frontend/);
      # publishConfig.access=public steht in package.json.
      #
      # KEIN --provenance: npm akzeptiert Provenance-Attestierungen ausschließlich von
      # GitHub-HOSTED Runnern (E422 "Unsupported ... self-hosted"). Wir laufen wegen des
      # Org-Billing-Bugs aber self-hosted. Sobald wieder github-hosted publiziert wird,
      # kann --provenance zurück. Die OIDC-Auth ist davon unberührt und läuft self-hosted.
      - name: Publish (Trusted Publishing / OIDC)
        run: npm publish --provenance=false
        env:
          NPM_CONFIG_PROVENANCE: "false"
