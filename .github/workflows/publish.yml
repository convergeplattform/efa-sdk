name: Publish @efa-one/sdk

# Löst den npm-Publish beim Pushen eines v*-Tags aus (analog zum GHCR-Flow der Apps).
# Der reine main-Push publiziert nichts.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    # Org-Minuten/Billing-Bug: bei gesetzter Repo-Var RUNNER_LABEL=self-hosted läuft
    # der Job auf dem self-hosted Runner (dw-vps-converge), sonst GitHub-hosted.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write   # OIDC für npm Trusted Publishing (kein langlebiger Token)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      # Trusted Publishing (OIDC) braucht npm >= 11.5.1 — Node 24 bringt npm 11.x,
      # zur Sicherheit auf latest heben.
      - name: npm auf OIDC-fähige Version heben
        run: npm install -g npm@latest

      - name: Tag ↔ package.json-Version abgleichen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG passt nicht zu package.json ($PKG). Erst 'npm version' dann taggen."
            exit 1
          fi
          echo "Version $PKG bestätigt."

      - name: Test (Gate)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # Trusted Publishing: npm authentifiziert sich per OIDC (id-token oben) gegen
      # den auf npmjs.com hinterlegten Trusted Publisher — KEIN NODE_AUTH_TOKEN nötig.
      # npm publish baut via prepublishOnly neu (backend/ + frontend/);
      # publishConfig.access=public steht in package.json.
      # --provenance=false, weil das Repo privat ist (Provenance verlangt ein
      # öffentliches Repo); die OIDC-Auth ist davon unabhängig.
      - name: Publish (Trusted Publishing / OIDC)
        run: npm publish --provenance=false
