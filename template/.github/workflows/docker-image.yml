name: Build Images

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  # IMAGE_BASE wird im Compute-Step gesetzt — der GitHub-Repo-Name darf
  # Hyphens enthalten, der GHCR-Image-Name muss Underscores tragen, damit der
  # davon abgeleitete serviceKey die Deployer-Regex `/^[a-z][a-z0-9_]{1,63}$/`
  # erfüllt.

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute IMAGE_BASE (normalize repo name)
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          REPO_NORM="${REPO//-/_}"
          echo "IMAGE_BASE=${OWNER}/${REPO_NORM}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-backend
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Docker meta (frontend)
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-frontend
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
