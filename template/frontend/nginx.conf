server {
    # Port 8080 (nicht 80): das Runtime-Image nginx-unprivileged läuft als non-root
    # und kann keine Ports < 1024 binden. Host-Mapping im Compose zeigt auf :8080.
    listen 8080;
    server_name _;

    # JWT-Cookies (converge_token + app_session pro App) sprengen den
    # Default 8k. Symmetrisch zum Gateway.
    large_client_header_buffers 4 32k;
    client_header_buffer_size 16k;

    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # Must resolve to a unique backend alias on converge-net.
    # When copying the template, replace "template-backend" with your app-specific alias.
    set $backend_upstream template-backend;

    location /health {
        proxy_pass http://$backend_upstream:3001;
        proxy_set_header Host $host;
    }

    location /dev/ {
        proxy_pass http://$backend_upstream:3001;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://$backend_upstream:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20m;
    }

    # Never cache index.html — ensures new builds are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache hashed assets forever (Vite adds content hash to filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
